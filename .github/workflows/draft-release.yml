name: Draft Release

# Creates (or updates) a draft GitHub release when a release/* PR is merged into the default branch.
# - Tag + title = the version in the branch name (release/1.2.3), with the "v" prefix the repo's
#   earlier tags use. This companion module carries no version in composer.json on purpose:
#   Packagist reads the tags, and a version field would have to be kept in step by hand.
# - Release notes = the matching "## [x.y.z]" section from CHANGELOG.md.
# Publishing the draft is the release; there is no Marketplace step for a compatibility module.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to draft (x.y.z)'
        required: true

permissions:
  contents: write

jobs:
  draft-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == github.event.repository.default_branch &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    env:
      # REPO_TOKEN (personal fine-grained PAT, Contents: read & write on the module repos) makes the draft
      # show up under that person's name; falls back to the workflow token ("github-actions") when not set.
      GH_TOKEN: ${{ secrets.REPO_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
      INPUT_VERSION: ${{ github.event.inputs.version || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Resolve version
        run: |
          VERSION="${INPUT_VERSION:-${HEAD_REF#release/}}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No x.y.z version in branch '$HEAD_REF' or input '$INPUT_VERSION'"; exit 1; }
          # Follow the repo's existing tag convention ("1.2.3" or "v1.2.3")
          LAST_TAG=$(gh release list --exclude-drafts --limit 1 --json tagName -q '.[0].tagName // ""')
          PREFIX=""
          [[ "$LAST_TAG" == v* ]] && PREFIX="v"
          TAG="$PREFIX$VERSION"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Version: $VERSION | Tag: $TAG (last: ${LAST_TAG:-none}) | Target: $TARGET_SHA"

      - name: Check tag is not released yet
        run: |
          for CANDIDATE in "$VERSION" "v$VERSION"; do
            if gh api "repos/$GH_REPO/git/ref/tags/$CANDIDATE" >/dev/null 2>&1; then
              echo "::error::Tag $CANDIDATE already exists; use a new release/x.y.z branch"
              exit 1
            fi
          done

      - name: Extract release notes from CHANGELOG.md
        run: |
          [ -f CHANGELOG.md ] || { echo "::error::CHANGELOG.md is missing"; exit 1; }
          awk -v v="## [$VERSION]" 'index($0, v) == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md \
            | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "::error::No '## [$VERSION]' section in CHANGELOG.md"; exit 1; }
          cat "$RUNNER_TEMP/notes.md"

      - name: Create or update draft release
        run: |
          IS_DRAFT=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo "none")
          case "$IS_DRAFT" in
            true)
              gh release edit "$TAG" --target "$TARGET_SHA" --notes-file "$RUNNER_TEMP/notes.md"
              echo "Updated existing draft $TAG"
              ;;
            false)
              echo "::error::Release $TAG is already published"
              exit 1
              ;;
            *)
              gh release create "$TAG" --draft --title "$TAG" --target "$TARGET_SHA" --notes-file "$RUNNER_TEMP/notes.md"
              echo "Created draft $TAG"
              ;;
          esac
          echo "RELEASE_URL=$(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_ENV"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Draft Release"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Version | \`${VERSION:-n/a}\` |"
            echo "| Target | \`$TARGET_SHA\` |"
            echo "| Draft | ${RELEASE_URL:-n/a} |"
            echo ""
            echo "Review the draft and click **Publish release**; Packagist picks the tag up from there."
          } >> "$GITHUB_STEP_SUMMARY"
